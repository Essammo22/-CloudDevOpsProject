
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ivolve
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 185467622030.dkr.ecr.eu-north-1.amazonaws.com/ivolve-repo:frontend-v1
          ports:
            - containerPort: 3000
          env:
            - name: AUTH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ivolve-configmap
                  key: AUTH_SERVICE_URL
            - name: ROADMAP_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: ivolve-configmap
                  key: ROADMAP_SERVICE_URL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: frontend-logs
              mountPath: /app/logs
      volumes:
        - name: frontend-logs
          emptyDir: {}
