apiVersion: apps/v1
kind: Deployment
metadata:
  name: roadmap
  namespace: ivolve
  
spec:
  replicas: 2
  selector:
    matchLabels:
      app: roadmap
  template:
    metadata:
      labels:
        app: roadmap
    spec:
      containers:
      - name: roadmap
        image: 185467622030.dkr.ecr.eu-north-1.amazonaws.com/ivolve-repo:roadmap-v1
        resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi" 
        ports:
        - containerPort: 8080
        volumeMounts:
          - name: roadmap-logs
            mountPath: /app/logs
      volumes:
        - name: roadmap-logs
          emptyDir: {}        

