---
- name: Install required packages for Trivy
  ansible.builtin.apt:
    name:
      - wget
      - gnupg
      - apt-transport-https
    state: present
    update_cache: true

- name: Download Trivy GPG key
  ansible.builtin.get_url:
    url: https://aquasecurity.github.io/trivy-repo/deb/public.key
    dest: /tmp/trivy.asc
    mode: '0644'

- name: Convert Trivy GPG key
  ansible.builtin.command:
    cmd: gpg --dearmor -o /usr/share/keyrings/trivy.gpg /tmp/trivy.asc
    creates: /usr/share/keyrings/trivy.gpg

- name: Add Trivy repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main"
    state: present
    filename: trivy

- name: Install Trivy
  ansible.builtin.apt:
    name: trivy
    state: present
    update_cache: true